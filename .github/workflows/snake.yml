name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username whose contribution graph to use
        required: false
        default: Royal-XO
        type: string
  push:
    branches:
      - main

concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate light, dark, and violet snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ inputs.username || github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-violet.svg?color_snake=#A78BFA&color_dots=#161B22,#211D39,#382C70,#6741C1,#A78BFA

      - name: Publish generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          allow_empty_commit: false
          jekyll: false
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
